name: couch-remote
base: core24
adopt-info: couch-remote
summary: Remote control for Android TV and Google TV
description: |
  Couch Remote is a GTK remote control for Android TV and Google TV devices on
  the local network. It provides a physical remote-style interface, network
  discovery, pairing, saved TV profiles, Wake-on-LAN, configurable key mappings,
  a key tester for model-specific buttons, text input, connection diagnostics,
  app launching, and a command line interface.
license: GPL-3.0-or-later
icon: data/icons/hicolor/scalable/apps/io.github.angelodelorenzo.couch-remote.svg
confinement: strict
grade: stable
compression: lzo

apps:
  couch-remote:
    extensions: [gnome]
    command: bin/couch-remote-gui
    desktop: usr/share/applications/io.github.angelodelorenzo.couch-remote.desktop
    common-id: io.github.angelodelorenzo.couch-remote
    plugs:
      - network
      - network-bind
      - network-observe   # reads /proc/net/arp to auto-detect the TV MAC for Wake-on-LAN
  cli:
    extensions: [gnome]
    command: bin/couch-remote
    plugs:
      - network
      - network-bind
      - network-observe

parts:
  couch-remote:
    plugin: python
    source: .
    stage-packages:
      - python3-gi
      - python3-gi-cairo
      - gir1.2-gtk-3.0
    parse-info:
      - usr/share/metainfo/io.github.angelodelorenzo.couch-remote.metainfo.xml
    override-build: |
      craftctl default
      install -Dm644 data/io.github.angelodelorenzo.couch-remote.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/io.github.angelodelorenzo.couch-remote.desktop"
      install -Dm644 data/io.github.angelodelorenzo.couch-remote.metainfo.xml \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/io.github.angelodelorenzo.couch-remote.metainfo.xml"
      install -Dm644 data/icons/hicolor/scalable/apps/io.github.angelodelorenzo.couch-remote.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.angelodelorenzo.couch-remote.svg"
