name: Publish snap

# Builds the snap and uploads it to the Snap Store channel you choose.
# Requires the repository secret SNAPCRAFT_STORE_CREDENTIALS
# (created locally with: snapcraft export-login).

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Store channel to release to"
        type: choice
        default: edge
        options: [edge, beta, candidate, stable]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build

      - name: Publish to the Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ inputs.channel }}
