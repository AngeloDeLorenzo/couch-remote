app-id: io.github.angelodelorenzo.CouchRemote
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: couch-remote-gui
build-options:
  build-args:
    - --share=network
finish-args:
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=xdg-config/couch-remote:create
modules:
  - name: couch-remote
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-build-isolation .
      - install -Dm644 data/io.github.angelodelorenzo.CouchRemote.desktop /app/share/applications/io.github.angelodelorenzo.CouchRemote.desktop
      - install -Dm644 data/io.github.angelodelorenzo.CouchRemote.metainfo.xml /app/share/metainfo/io.github.angelodelorenzo.CouchRemote.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.angelodelorenzo.CouchRemote.svg /app/share/icons/hicolor/scalable/apps/io.github.angelodelorenzo.CouchRemote.svg
    sources:
      - type: dir
        path: ../..
